name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests tenacity pyspark

      - name: Run bronze ingestion tests
        env:
          PYTHONPATH: src
        run: pytest tests/test_bronze_ingestion.py -v

        # CERTO — quando tens múltiplas linhas no run
      - name: Run tests with coverage
        run: |
          pytest --cov=src/market_pulse --cov-report=xml
    
      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
